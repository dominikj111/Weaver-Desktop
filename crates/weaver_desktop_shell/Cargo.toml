[package]
name = "weaver_desktop_shell"
version = "0.1.0"
edition = "2024"
description = "Desktop shell for Weaver Desktop"

[dependencies]
weaver_fabric = { path = "../weaver_fabric" }
weaver_lib = { path = "../weaver_lib" }
egui = "0.36.1"
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
] } # Image loading for background
egui-toast = "0.22"
resvg = "0.48.1"  # SVG rendering for icon themes
egui_term = { path = "../../forks/egui_term" } # Vendored fork (egui 0.36)
chrono = "0.4"
