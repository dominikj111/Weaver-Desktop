[package]
name = "weaver_lib"
version = "0.1.0"
edition = "2024"
description = "UI framework abstractions for Weaver Desktop"

[dependencies]
egui = "0.36.1"
chrono = "0.4"
arrayvec = "0.7" # Stack-allocated strings/vectors for zero-heap formatting
egui-toast = "0.22"
egui_term = { path = "../../forks/egui_term" } # Vendored fork (egui 0.36)
image = { version = "0.25.10", default-features = false, features = [
    "jpeg",
    "png",
] } # Image loading for background
